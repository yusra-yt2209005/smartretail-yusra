[alembic]

# Location of Alembic's migration environment.
# Our migrations live in the migrations/ directory at the repo root.
script_location = migrations

# Adds the project root to Python's import path so Alembic can import
# modules such as app.db.base and app.models.
prepend_sys_path = .

# sqlalchemy.url is intentionally not stored here.
# migrations/env.py gets it from our Settings object, which reads
# DATABASE_URL from the environment/.env file.


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S